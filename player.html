<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازر اللاعب - لعبة حروف</title>
  
  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    input, select {
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 1px solid #444;
      margin-bottom: 15px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      background: #2a2a2a;
      color: #fff;
    }
    .buzz-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle, #e74c3c, #c0392b);
      color: #fff;
      font-size: 2.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(231, 76, 60, 0.5);
      transition: transform 0.1s;
      margin-top: 10px;
    }
    .buzz-btn:active {
      transform: scale(0.92);
    }
    #msg {
      margin-top: 25px;
      font-size: 1.3rem;
      font-weight: bold;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <h2>بازر حروف</h2>
  
  <input type="text" id="playerName" placeholder="اكتب اسمك هنا">
  
  <select id="playerTeam">
    <option value="green">الفريق الأخضر</option>
    <option value="red">الفريق الأحمر</option>
  </select>

  <button class="buzz-btn" onclick="pressBuzzer()">جاوب!</button>
  
  <div id="msg"></div>

  <script>
    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyDoaUuh2g7Ey3xKULKY1cqCsFp0ayV8LYM",
      authDomain: "hroof-game-89a4d.firebaseapp.com",
      databaseURL: "https://hroof-game-89a4d-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "hroof-game-89a4d",
      storageBucket: "hroof-game-89a4d.firebasestorage.app",
      messagingSenderId: "289753652476",
      appId: "1:289753652476:web:cf0de09e5c657a22c60b79",
      measurementId: "G-8G7SXXV8JS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

   function pressBuzzer() {
  const name = document.getElementById('playerName').value.trim();
  const team = document.getElementById('playerTeam').value;
  const msg = document.getElementById('msg');

  if (!name) {
    alert('يرجى كتابة اسمك أولاً');
    return;
  }

 // الاستماع لحالة البازر لتفعيل أو تعطيل الزر تلقائياً
db.ref('game/buzzer').on('value', (snapshot) => {
  const data = snapshot.val();
  const buzzerBtn = document.getElementById('buzzerBtn');
  const statusMsg = document.getElementById('statusMsg');

  if (!data || data.winner) {
    // إذا كان هناك فائز مسجل
    if (data && data.winner === playerName) {
      statusMsg.innerText = "أنت أول من ضغط! دورك في الإجابة";
      statusMsg.style.color = "#2ecc71";
    } else {
      statusMsg.innerText = "سبقك لاعب آخر!";
      statusMsg.style.color = "#e74c3c";
    }
  } else {
    // البازر متاح وجاهز للضغط
    statusMsg.innerText = "البازر جاهز! استعد للضغط";
    statusMsg.style.color = "#f1c40f";
  }
});

// دالة ضغط الزر باستخدام المعاملات (Transaction) لمنع التضارب
function pressBuzzer() {
  const statusMsg = document.getElementById('statusMsg');
  const buzzerRef = db.ref('game/buzzer');

  // إظهار استجابة فورية للمس الزر
  if (statusMsg) statusMsg.innerText = "جاري الإرسال...";

  buzzerRef.transaction((currentData) => {
    // يقبل الضغطة إذا لم يكن هناك فائز مسجل
    if (!currentData || !currentData.winner) {
      return {
        active: false,
        winner: currentName || "لاعب",
        team: currentTeam || "green",
        timestamp: Date.now()
      };
    }
    // إذا كان هناك فائز بالفعل، يلغي العملية
    return undefined;
  }, (error, committed, snapshot) => {
    if (error) {
      console.error("Firebase Error:", error);
      if (statusMsg) {
        statusMsg.innerText = "❌ خطأ في الاتصال بقاعدة البيانات!";
        statusMsg.style.color = "#e74c3c";
      }
      alert("خطأ Firebase: " + error.message);
    } else if (committed) {
      if (statusMsg) {
        statusMsg.innerText = "🎯 مبروك! أنت أول من ضغط!";
        statusMsg.style.color = "#2ecc71";
      }
    } else {
      if (statusMsg) {
        const winnerName = snapshot && snapshot.val() ? snapshot.val().winner : "لاعب آخر";
        statusMsg.innerText = `❌ سبقك بالضغط: ${winnerName}`;
        statusMsg.style.color = "#e74c3c";
      }
    }
  });
}
  </script>
</body>
</html>
