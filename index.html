<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لعبة حروف - شاشة العرض</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  
  <!-- مكتبة توليد الـ QR Code -->
  <!-- في ملف index.html -->
<!-- استبدل هذا السطر -->
<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> -->

<!-- بهذا السطر (في قسم head) -->
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.min.js"></script>
</head>
<body>
  <div class="main-layout">
    <!-- حاوية اللعبة الرئيسية -->
    <div class="game-container">
      <h1>مسابقة حروف</h1>
      
      <div class="timer" id="timer">الوقت: 5 ثواني</div>
      <div class="question-box" id="questionBox">اختر حرفاً لبدء السؤال</div>
      <div class="buzzer-status" id="buzzerStatus">في انتظار الضغط على البازر...</div>
      
      <div class="board" id="board"></div>
<!-- شريط الإعدادات السريعة -->
<div id="settingsBar" style="display: flex; gap: 15px; align-items: center; justify-content: center; margin: 15px 0; background: #222; padding: 10px 20px; border-radius: 10px; border: 1px solid #333;">
  <label style="color: #bbb; font-size: 14px;">مدة المؤقت:</label>
  <select id="timerDurationSelect" onchange="updateTimerDuration(this.value)" style="padding: 6px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; cursor: pointer;">
    <option value="3">3 ثواني</option>
    <option value="5" selected>5 ثواني</option>
    <option value="7">7 ثواني</option>
    <option value="10">10 ثواني</option>
    <option value="15">15 ثانية</option>
  </select>

  <label style="color: #bbb; font-size: 14px; margin-right: 15px;">
    <input type="checkbox" id="muteToggle" onchange="toggleSound(this.checked)" style="cursor: pointer;"> كتم الصوت
  </label>

  <button type="button" onclick="resetFullGame()" style="padding: 6px 12px; background: #555; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">تصفير اللوحة بالكامل</button>
</div>
      <div class="controls">
        <button class="btn green-btn" onclick="setCellColor('green')">فوز الأخضر</button>
        <button class="btn red-btn" onclick="setCellColor('red')">فوز الأحمر</button>
        <button class="btn reset-btn" onclick="setCellColor('neutral')">إلغاء الخانة</button>
        <button class="btn" style="background:#f39c12; color:#fff;" onclick="resetBuzzer()">إعادة تفعيل البازر</button>
      </div>
    </div>

    <!-- بطاقة باركود انضمام اللاعبين -->
    <div class="qr-container">
      <h3>امسح للدخول وبدء اللعب</h3>
      <div id="qrcode"></div>
      <p>أو افتح صفحة البازر على هاتفك</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
